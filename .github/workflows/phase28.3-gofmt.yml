name: Format Phase 28.3 Go files

on:
  push:
    branches: [sol/phase28.3-hardware-discovery]
    paths:
      - ".github/workflows/phase28.3-gofmt.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sol/phase28.3-hardware-discovery
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache: false

      - name: Format Go
        working-directory: agent
        run: gofmt -w .

      - name: Commit formatting
        run: |
          if git diff --quiet -- agent; then
            echo "Go formatting already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent
          git commit -m "Format Phase 28.3 hardware discovery code"
          git push origin HEAD:sol/phase28.3-hardware-discovery
