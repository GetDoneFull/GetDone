name: PostgreSQL Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: postgres-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NPM_CONFIG_IGNORE_SCRIPTS: "true"
  GETDONE_DB_RUNTIME_ROLE: getdone_tenant_runtime

jobs:
  postgres16:
    runs-on: ubuntu-latest
    timeout-minutes: 65

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run PostgreSQL 16 migration and concurrency acceptance
        run: npm run db:test-integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"

      - name: Run zero-downtime rolling migration acceptance
        run: npm run db:test-zero-downtime
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"

      - name: Run PostgreSQL startup/readiness acceptance
        run: npx vitest run lib/persistence/postgres/postgres-readiness.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_POSTGRES_INTEGRATION: "true"

      - name: Run PostgreSQL tenant RLS adversarial acceptance
        run: npx vitest run lib/persistence/postgres/postgres-tenant-rls.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_POSTGRES_INTEGRATION: "true"

      - name: Run production runtime startup validator acceptance
        run: npx vitest run lib/runtime/production-runtime-validator.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_POSTGRES_INTEGRATION: "true"

      - name: Run deterministic production bootstrap acceptance
        run: npx vitest run lib/auth/production-bootstrap.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_POSTGRES_INTEGRATION: "true"

      - name: Migrate Control API integration database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"

      - name: Run UFO orchestration persistence acceptance
        run: npx vitest run lib/persistence/postgres/orchestration-store.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_DB_RUNTIME_ROLE: getdone_tenant_runtime
          GETDONE_POSTGRES_INTEGRATION: "true"

      - name: Run UFO orchestration durable worker acceptance
        run: npx vitest run lib/persistence/postgres/orchestration-worker-store.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_DB_RUNTIME_ROLE: getdone_tenant_runtime
          GETDONE_POSTGRES_INTEGRATION: "true"

      - name: Run OwnerIntent orchestration admission acceptance
        run: npx vitest run lib/persistence/postgres/owner-intent-orchestration.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_DB_RUNTIME_ROLE: getdone_tenant_runtime
          GETDONE_POSTGRES_INTEGRATION: "true"

      - name: Run durable orchestration planning acceptance
        run: npx vitest run lib/persistence/postgres/orchestration-planning.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_DB_RUNTIME_ROLE: getdone_tenant_runtime
          GETDONE_POSTGRES_INTEGRATION: "true"

      - name: Run durable validation and policy acceptance
        run: npx vitest run lib/persistence/postgres/orchestration-validation-policy.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_DB_RUNTIME_ROLE: getdone_tenant_runtime
          GETDONE_POSTGRES_INTEGRATION: "true"

      - name: Run durable authorization acceptance
        run: npx vitest run lib/persistence/postgres/orchestration-authorization.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_DB_RUNTIME_ROLE: getdone_tenant_runtime
          GETDONE_POSTGRES_INTEGRATION: "true"

      - name: Run PostgreSQL rate limit acceptance
        run: npx vitest run lib/security/rate-limit-postgres.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_POSTGRES_INTEGRATION: "true"

      - name: Run analytics ingestion checkpoint and dedupe acceptance
        run: npx vitest run lib/analytics/analytics-ingestion-postgres.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_POSTGRES_INTEGRATION: "true"

      - name: Run audit ledger tamper detection acceptance
        run: npx vitest run lib/security/audit-ledger-integrity-postgres.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_POSTGRES_INTEGRATION: "true"

      - name: Run real staging backup restore and app boot acceptance
        run: npm run db:test-backup-restore
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"

      - name: Run disaster recovery primary-loss acceptance
        run: npm run dr:test-acceptance
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_POSTGRES_INTEGRATION: "true"

      - name: Run owner-safe AI Gateway health PostgreSQL acceptance
        run: npx vitest run lib/ai-gateway/health-postgres.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_POSTGRES_INTEGRATION: "true"

      - name: Run PostgreSQL-backed Control API acceptance
        run: npx vitest run lib/control-api/postgres-http.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_RUNTIME_ENV: staging
          GETDONE_DATA_MODE: authoritative
          NEXT_PUBLIC_APP_ENV: staging
          GETDONE_POSTGRES_INTEGRATION: "true"

      - name: Run durable worker failure acceptance
        run: npx vitest run lib/execution/postgres-worker.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_POSTGRES_INTEGRATION: "true"

      - name: Run queue saturation and backpressure acceptance
        run: npx vitest run lib/execution/queue-backpressure-postgres.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_POSTGRES_INTEGRATION: "true"

      - name: Run dead-letter operator acceptance
        run: npx vitest run lib/execution/dead-letter-operator-postgres.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_POSTGRES_INTEGRATION: "true"

      - name: Run correlation lineage reconstruction acceptance
        run: npx vitest run lib/observability/correlation-lineage-postgres.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_POSTGRES_INTEGRATION: "true"

      - name: Build crash acceptance worker process
        run: npm run build:worker-acceptance

      - name: Run worker crash/restart acceptance
        run: npx vitest run lib/execution/worker-crash-restart.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_POSTGRES_INTEGRATION: "true"

      - name: Run production auth and WebAuthn acceptance
        run: npx vitest run lib/auth/postgres-auth.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          GETDONE_DB_SSL: "false"
          GETDONE_POSTGRES_INTEGRATION: "true"
